<!doctype html>
<html lang="ru">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Spotify Control</title>
	<style>
		:root {
			--bg: #121417;
			--text: #f1f5f9;
			--accent: #22c55e;
			--ok: #22c55e;
			--err: #ef4444;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: var(--bg);
			color: var(--text);
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		.clock {
			width: 220px;
			margin: 0 auto 4px;
			text-align: center;
			font-family: "Roboto", sans-serif;
			font-size: 50px;
			font-weight: 700;
			letter-spacing: 0.06em;
			font-variant-numeric: tabular-nums;
			line-height: 1.1;
			user-select: none;
		}

		.status {
			font-size: 20px;
			line-height: 1;
			margin-bottom: 0;
			user-select: none;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 20px;
		}

		.status.ok {
			color: var(--ok);
		}

		.status.err {
			color: var(--err);
		}

		.controls {
			display: flex;
			align-items: center;
			gap: 2px;
			width: 220px;
		}

		button {
			width: 48px;
			height: 48px;
			border: 0;
			background: transparent;
			color: var(--text);
			font-size: 30px;
			line-height: 1;
			padding: 0;
			cursor: pointer;
			transition: transform 80ms ease, filter 120ms ease, opacity 120ms ease;
		}

		button:hover {
			filter: brightness(1.1);
			opacity: 0.95;
		}

		button:active {
			transform: translateY(1px);
		}

		button:focus-visible {
			outline: 1px solid #4ade80;
			outline-offset: 2px;
		}

		.volume-wrap {
			width: 120px;
			display: flex;
		}

		input[type="range"] {
			width: 100%;
			accent-color: var(--accent);
			cursor: pointer;
		}
	</style>
</head>

<body>
	<main>
		<div id="clock" class="clock">00:00</div>
		<div class="controls">
			<button id="playPauseBtn" type="button">⏯️</button>
			<button id="nextBtn" type="button">⏭️</button>
			<div class="volume-wrap">
				<input id="volume" type="range" min="0" max="100" step="1" value="50" />
			</div>
			<div id="status" class="status err" title="Disconnected">•</div>
		</div>
	</main>

	<script>
		// 1) Настрой под свой Streamer.bot WebSocket сервер.
		const WS_URL = "ws://127.0.0.1:8080/";

		// 2) Укажи имена твоих экшнов в Streamer.bot.
		const ACTION_NAMES = {
			playPause: "SP Toggle",
			next: "SP Next",
			setVolume: "SP Volume WEB control"
		};
		const GLOBAL_VOLUME_VAR = "spotify.player.volume";
		const GLOBAL_VOLUME_POLL_MS = 1500;

		const statusEl = document.getElementById("status");
		const clockEl = document.getElementById("clock");
		const playPauseBtn = document.getElementById("playPauseBtn");
		const nextBtn = document.getElementById("nextBtn");
		const volumeEl = document.getElementById("volume");

		let ws;
		let requestId = 1;
		let volumeDebounce = null;
		let volumePollTimer = null;
		let pendingVolumeRequestId = null;
		let lastLocalVolumeChangeAt = 0;

		function clampVolume(value) {
			const num = Number(value);
			if (!Number.isFinite(num)) return null;
			if (num < 0) return 0;
			if (num > 100) return 100;
			return Math.round(num);
		}

		function extractVolumeFromMessage(msg) {
			if (!msg || typeof msg !== "object") return null;

			const candidates = [
				msg.value,
				msg?.data?.value,
				msg?.result?.value,
				msg?.global?.value,
				msg?.variables?.[GLOBAL_VOLUME_VAR],
				msg?.globals?.[GLOBAL_VOLUME_VAR]
			];

			for (const candidate of candidates) {
				const v = clampVolume(candidate);
				if (v !== null) return v;
			}

			return null;
		}

		function findNamedGlobalValue(node, targetName) {
			if (!node || typeof node !== "object") return null;

			if (Array.isArray(node)) {
				for (const item of node) {
					const nested = findNamedGlobalValue(item, targetName);
					if (nested !== null) return nested;
				}
				return null;
			}

			if (typeof node.variable === "string" && node.variable.toLowerCase() === targetName.toLowerCase()) {
				const fromVariable = clampVolume(node.value);
				if (fromVariable !== null) return fromVariable;
			}

			if (typeof node.name === "string" && node.name.toLowerCase() === targetName.toLowerCase()) {
				const fromName = clampVolume(node.value);
				if (fromName !== null) return fromName;
			}

			if (Object.prototype.hasOwnProperty.call(node, targetName)) {
				const direct = node[targetName];
				const directValue = clampVolume(direct);
				if (directValue !== null) return directValue;

				if (direct && typeof direct === "object") {
					const nestedDirect = clampVolume(direct.value);
					if (nestedDirect !== null) return nestedDirect;
				}
			}

			for (const key of Object.keys(node)) {
				const nested = findNamedGlobalValue(node[key], targetName);
				if (nested !== null) return nested;
			}

			return null;
		}

		function requestGlobalVolume() {
			if (!ws || ws.readyState !== WebSocket.OPEN) return;
			if (pendingVolumeRequestId) return;

			pendingVolumeRequestId = "vol-" + String(requestId++);
			ws.send(JSON.stringify({
				request: "GetGlobals",
				id: pendingVolumeRequestId,
				persisted: false
			}));
		}

		function startVolumePolling() {
			if (volumePollTimer) clearInterval(volumePollTimer);
			requestGlobalVolume();
			volumePollTimer = setInterval(requestGlobalVolume, GLOBAL_VOLUME_POLL_MS);
		}

		function stopVolumePolling() {
			if (volumePollTimer) {
				clearInterval(volumePollTimer);
				volumePollTimer = null;
			}
			pendingVolumeRequestId = null;
		}

		function setStatus(isConnected) {
			statusEl.textContent = "•";
			statusEl.className = "status " + (isConnected ? "ok" : "err");
			statusEl.title = isConnected ? "Connected" : "Disconnected";
		}

		function updateClock() {
			const now = new Date();
			const hh = String(now.getHours()).padStart(2, "0");
			const mm = String(now.getMinutes()).padStart(2, "0");
			clockEl.textContent = hh + ":" + mm;
		}

		function connect() {
			ws = new WebSocket(WS_URL);

			ws.addEventListener("open", () => {
				setStatus(true);
				startVolumePolling();
			});

			ws.addEventListener("close", () => {
				setStatus(false);
				stopVolumePolling();
				setTimeout(connect, 2000);
			});

			ws.addEventListener("error", () => {
				setStatus(false);
				stopVolumePolling();
			});

			ws.addEventListener("message", (event) => {
				let msg;
				try {
					msg = JSON.parse(event.data);
				} catch {
					return;
				}

				if (!pendingVolumeRequestId || msg?.id !== pendingVolumeRequestId) {
					return;
				}

				pendingVolumeRequestId = null;

				let remoteVolume = extractVolumeFromMessage(msg);
				if (remoteVolume === null) {
					remoteVolume = findNamedGlobalValue(msg, GLOBAL_VOLUME_VAR);
				}
				if (remoteVolume === null) return;

				// Avoid fighting user input right after local slider changes.
				if (Date.now() - lastLocalVolumeChangeAt < 800) return;

				if (Number(volumeEl.value) !== remoteVolume) {
					volumeEl.value = String(remoteVolume);
				}
			});
		}

		function sendAction(actionName, args) {
			if (!ws || ws.readyState !== WebSocket.OPEN) {
				setStatus(false);
				return;
			}

			const payload = {
				request: "DoAction",
				id: String(requestId++),
				action: { name: actionName },
				args: args || {}
			};

			ws.send(JSON.stringify(payload));
		}

		playPauseBtn.addEventListener("click", () => {
			sendAction(ACTION_NAMES.playPause);
		});

		nextBtn.addEventListener("click", () => {
			sendAction(ACTION_NAMES.next);
		});

		volumeEl.addEventListener("input", () => {
			const v = Number(volumeEl.value);
			lastLocalVolumeChangeAt = Date.now();

			clearTimeout(volumeDebounce);
			volumeDebounce = setTimeout(() => {
				sendAction(ACTION_NAMES.setVolume, { volume: String(v) });
			}, 120);
		});

		connect();
		setStatus(false);
		updateClock();
		setInterval(updateClock, 1000);
	</script>
</body>

</html>
